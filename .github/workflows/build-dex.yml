name: Build classes.dex
on:
  workflow_dispatch:
  push:
    paths: ["UpdateDialog.java"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile to classes.dex
        run: |
          ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar
          D8=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/d8
          mkdir out dexout
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d out UpdateDialog.java
          $D8 --release --min-api 21 --lib "$ANDROID_JAR" --output dexout $(find out -name "*.class")
          cp dexout/classes.dex classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: classes.dex
          path: classes.dex
          
